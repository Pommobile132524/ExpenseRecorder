<!doctype html>
<!--
  STARTER for a custom overlay design. Copy into the job folder as overlay.html and design freely.
  Keep the parts marked CONTRACT — the renderer depends on them (see references/contract.md).
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay</title>
<script src="gsap.min.js"></script>                           <!-- CONTRACT: local copy, put there by render.js -->
<script src="job.js"></script>                                <!-- CONTRACT: window.JOB from job.json (written by render.js) -->
<!-- Fonts: bundled LINE Seed (fonts/…) or Google Fonts, e.g.
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet"> -->
<style>
  @font-face{font-family:LINESeed;src:url(fonts/LINESeedSansTH_Rg.otf);font-weight:300 400}
  @font-face{font-family:LINESeed;src:url(fonts/LINESeedSansTH_Bd.otf);font-weight:500 700}
  @font-face{font-family:LINESeed;src:url(fonts/LINESeedSansTH_XBd.otf);font-weight:800}
  @font-face{font-family:LINESeed;src:url(fonts/LINESeedSansTH_He.otf);font-weight:900}

  /* ---- CI tokens: set from the product image / reference images ---- */
  :root{ --ink:#0b0f1a; --brand:#ff6a3d; --brand2:#ffd166; --paper:#ffffff; --font-head:LINESeed, sans-serif; --font-body:LINESeed, sans-serif; }

  /* ---- CONTRACT: fixed 1080x1920 stage, scaled to the window for preview ---- */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#111;color:var(--paper);font-family:var(--font-body)}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}
  #pv{position:absolute;inset:0;background:center/cover no-repeat}          /* preview-only backdrop */
  #pv.checker{background:conic-gradient(#2a2a2a 25%,#3a3a3a 0 50%,#2a2a2a 0 75%,#3a3a3a 0) 0 0/60px 60px}
  #ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:12px;background:rgba(0,0,0,.7);font:14px system-ui;z-index:10}
  #ui button{background:#333;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}

  /* ---- DESIGN: everything below is yours ----
     Frame budget: TOP ZONE y 0–548 ONLY (top 2/7) · clip zone 548–1440 (keep empty) · BOTTOM ZONE y 1440–1920 ONLY (lowest 1/4)
     incl. shadows/glows/overshoot. Product image lives INSIDE the bottom zone. */
  .top{position:absolute;left:64px;right:64px;top:150px}
  .headline{font:800 96px/1.1 var(--font-head)}          /* hook font: match the reference (templates/font-compare) */

  .panel{position:absolute;left:0;right:0;top:1470px;bottom:0;background:linear-gradient(160deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--brand)));
         clip-path:polygon(0 30px,100% 0,100% 100%,0 100%)}
  .panel .pat{position:absolute;inset:0;opacity:.08;background:repeating-linear-gradient(-45deg,#fff 0 2px,transparent 2px 18px)}
  .stripe{position:absolute;left:0;right:0;top:1452px;height:14px;background:var(--brand);clip-path:polygon(0 18px,100% 0,100% 6px,0 24px)}
  .prod{position:absolute;left:30px;top:1490px;width:360px;height:340px}             /* product cut-out, inside the panel */
  .prod .glow{position:absolute;inset:10% 0 0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand2) 55%,transparent),transparent 65%)}
  .prod img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
  .offer{position:absolute;left:420px;right:50px;top:1500px}
  .offer .lbl{font:700 32px/1.1 var(--font-body);color:var(--brand2)}
  .offer .big{font:900 120px/1 var(--font-head);color:var(--paper);white-space:nowrap}
  .cta{position:absolute;left:50px;right:50px;top:1800px;height:96px;border-radius:999px;background:var(--brand);
       display:flex;align-items:center;justify-content:center;font:800 46px var(--font-head);white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div id="pv"></div>                                                         <!-- CONTRACT: removed in render mode -->
  <!-- DESIGN: your overlay elements. Keep the middle band clear for the user's clip. -->
  <div class="top"><div class="headline" id="headline">พาดหัว</div></div>
  <div class="stripe"></div>
  <div class="panel"><div class="pat"></div></div>
  <div class="prod"><div class="glow"></div><img src="img/product.png" alt=""></div>
  <div class="offer"><div class="lbl">ข้อเสนอหลัก</div><div class="big" id="big">฿999</div></div>
  <div class="cta" id="cta">สั่งซื้อเลย →</div>
</div>
<div id="ui"><button id="bg">สลับพื้นหลัง</button><button id="replay">↺ เล่นใหม่</button></div>   <!-- CONTRACT -->

<script>
/* ---------------- CONTRACT plumbing (keep) ---------------- */
const $ = q => document.querySelector(q), $$ = q => [...document.querySelectorAll(q)];
const params = new URLSearchParams(location.search), MODE = params.get('render');   // null | 'preview' | '1'
const JOB = window.JOB || {};                                                     // job.json injected by render.js (duration, previewBackground …)
function fit(){ const st=$('#stage'), k=Math.min(innerWidth/1080, innerHeight/1920);
  st.style.transform=`scale(${k})`; st.style.left=(innerWidth-1080*k)/2+'px'; st.style.top=(innerHeight-1920*k)/2+'px'; }
addEventListener('resize', fit); fit();
let master;

/* ---------------- DESIGN: build the animation on ONE master timeline ---------------- */
function build(){
  const intro = gsap.timeline();
  intro.from('.headline',{y:-80,opacity:0,duration:.6,ease:'back.out(2)'},0.2)
       .from('.panel,.stripe',{yPercent:100,y:480,duration:.6,ease:'power3.out'},0.4)       // slide up from below: never overshoots above y 1440
       .from('.prod',{y:120,opacity:0,duration:.6,ease:'power3.out'},0.7)
       .from('.offer',{x:80,opacity:0,duration:.5,ease:'power2.out'},0.85)
       .from('.cta',{scale:0,duration:.5,ease:'back.out(2)'},1.0);

  const LOOP = 6;                                    // idle loop: must be seamless (end state == start state)
  const loop = gsap.timeline({repeat:-1});
  loop.to('.cta',{scale:1.04,duration:LOOP/4,yoyo:true,repeat:3,ease:'sine.inOut'},0)
      .to('.prod img',{y:-8,duration:LOOP/2,yoyo:true,repeat:1,ease:'sine.inOut'},0);

  master = gsap.timeline({paused: !!MODE});          // CONTRACT: paused in render/preview mode
  master.add(intro, 0).add(loop, intro.duration());
  window.RENDER = { seek: t => { master.time(t); }, ready: true };   // CONTRACT: seek returns nothing
}

/* ---------------- CONTRACT boot (keep) ---------------- */
$('#bg').onclick = ()=>$('#pv').classList.toggle('checker');
$('#replay').onclick = ()=>master.restart();
(async ()=>{
  await document.fonts.ready;
  if(JOB.previewBackground) $('#pv').style.backgroundImage = `url("${JOB.previewBackground}")`;
  if(MODE){ $('#ui').remove(); if(MODE !== 'preview'){ document.documentElement.style.background='transparent'; document.body.style.background='transparent'; $('#pv').remove(); } }
  build();
})();
</script>
</body>
</html>
